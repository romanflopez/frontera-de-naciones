syntax = "proto3";

package mmorpg.network;

enum MonsterEntityState {
  MONSTER_ENTITY_STATE_IDLE = 0;
  MONSTER_ENTITY_STATE_MOVE = 1;
  MONSTER_ENTITY_STATE_ATTACK = 2;
}

enum GroundEffectType {
  GROUND_EFFECT_TYPE_FIRE = 0;
  GROUND_EFFECT_TYPE_POISON = 1;
  GROUND_EFFECT_TYPE_SPIKE_FIELD = 2;
  GROUND_EFFECT_TYPE_ICE_STORM = 3;
}

enum TemporaryEffectType {
  TEMPORARY_EFFECT_TYPE_INVISIBILITY = 0;
  TEMPORARY_EFFECT_TYPE_CHILL = 1;
  TEMPORARY_EFFECT_TYPE_BERSERK = 2;
}

enum TemporaryEffectEntityKind {
  TEMPORARY_EFFECT_ENTITY_KIND_PLAYER = 0;
  TEMPORARY_EFFECT_ENTITY_KIND_MONSTER = 1;
}

// Matches client Gender / server persistence: 0 = male, 1 = female.
enum PlayerGender {
  PLAYER_GENDER_MALE = 0;
  PLAYER_GENDER_FEMALE = 1;
}

// Matches client SkinColor / server persistence: 0 = light, 1 = tanned, 2 = dark.
enum PlayerSkinColor {
  PLAYER_SKIN_COLOR_LIGHT = 0;
  PLAYER_SKIN_COLOR_TANNED = 1;
  PLAYER_SKIN_COLOR_DARK = 2;
}

// Matches client MapDialog / WeatherManager string modes (dry, rain-*, snow-*).
enum WeatherMode {
  WEATHER_MODE_DRY = 0;
  WEATHER_MODE_RAIN_LIGHT = 1;
  WEATHER_MODE_RAIN_MEDIUM = 2;
  WEATHER_MODE_RAIN_HEAVY = 3;
  WEATHER_MODE_SNOW_LIGHT = 4;
  WEATHER_MODE_SNOW_MEDIUM = 5;
  WEATHER_MODE_SNOW_HEAVY = 6;
}

message ClientMessage {
  oneof payload {
    PingRequest ping_request = 1;
    RequestMovement request_movement = 2;
    MakeServerCellOccupiedRequest make_server_cell_occupied_request = 3;
    PlayerMovementStateChangeRequest player_movement_state_change_request = 5;
    AuthenticateRequest authenticate_request = 6;
    CreateCharacterRequest create_character_request = 1000;
    SelectCharacterRequest select_character_request = 1001;
    DeleteCharacterRequest delete_character_request = 1002;
    LogoutRequest logout_request = 7;
    LogoutCancelledRequest logout_cancelled_request = 8;
    // En desuso (reservado): el cambio de mapa va por PortalRequest / MapTransfer / MapReady.
    WorldChangeRequest world_change_request = 9;
    PlayerAttackModeChangeRequest player_attack_mode_change_request = 10;
    ChangePlayerIdleDirectionRequest change_player_idle_direction_request = 11;
    SummonMonsterRequested summon_monster_requested = 12;
    PlayerAttackedMonsterRequest player_attacked_monster_request = 13;
    PlayerResurrectedRequest player_resurrected_request = 14;
    PlayerPickupRequested player_pickup_requested = 15;
    PlayerBowStanceRequested player_bow_stance_requested = 16;
    PlayerAttackedPlayerRequest player_attacked_player_request = 17;
    KillAllMonstersRequested kill_all_monsters_requested = 22;
    PlayerTeleportRequested player_teleport_requested = 23;
    SpellCastStartRequest spell_cast_start_request = 24;
    SpellCastCancelRequest spell_cast_cancel_request = 25;
    SpellCastRequest spell_cast_request = 26;
    ChangePlayerAttackTypeRequest change_player_attack_type_request = 28;
    ChangePlayerAllowDashAttackRequest change_player_allow_dash_attack_request = 29;
    CreateItemRequest create_item_request = 30;
    MoveItemInBagRequest move_item_in_bag_request = 31;
    EquipItemRequest equip_item_request = 32;
    UnequipItemRequest unequip_item_request = 33;
    ConsumeItemRequest consume_item_request = 34;
    ChangePlayerAppearanceRequest change_player_appearance_request = 35;
    PlayerItemDropRequested player_item_drop_requested = 36;
    PlayerItemPickupRequested player_item_pickup_requested = 37;
    ChatMessageSendRequest chat_message_send_request = 38;
    WeatherChangeRequest weather_change_request = 39;
    SummonNpcRequest summon_npc_request = 40;
    KillAllNpcsRequest kill_all_npcs_request = 41;
    ChangePlayerProfileRequest change_player_profile_request = 42;
    PvpHitRequest pvp_hit_request = 43;
    RemoverRequest remover_request = 44;
    InvisibilityRequest invisibility_request = 45;
    DetectInvisibleRequest detect_invisible_request = 46;
    HpReport hp_report = 47;
    RespawnRequest respawn_request = 48;
    BlinkRequest blink_request = 49;
    SkillRequest skill_request = 50;
    PotionRequest potion_request = 51;
    // Economía autoritativa (ver docs/ECONOMIA_SERVER.md): el cliente pide, el server valida y es dueño del estado.
    EconBuyRequest econ_buy_request = 90;
    EconSellRequest econ_sell_request = 91;
    EconEquipRequest econ_equip_request = 92;
    EconUnequipRequest econ_unequip_request = 93;
    EconDropRequest econ_drop_request = 94;
    EconSortRequest econ_sort_request = 95;
    EconQuestRequest econ_quest_request = 96;
    PickupRequest pickup_request = 97;
    // Mejora de ítems únicos en el herrero (docs/ITEMS.md §7).
    EconUpgradeRequest econ_upgrade_request = 98;
    // Reforja: re-tira UN stat extra del ítem (docs/ITEMS.md): piedras de reforja de jefes + oro, costo que se duplica por ítem.
    EconReforgeRequest econ_reforge_request = 99;
    SaveCharacterRequest save_character_request = 80;
    MobHitRequest mob_hit_request = 120;
    PveStatusRequest pve_status_request = 121;
    WaypointRequest waypoint_request = 122;
    // Cambio de mapa (ver docs/MUNDO.md 2.3): el cliente pisa un vínculo y pide cruzar por su id estable; cuando terminó de armar el mapa nuevo avisa MapReady.
    PortalRequest portal_request = 123;
    MapReady map_ready = 124;
    // Movimiento libre (ver PlayerPositionRequest).
    PlayerPositionRequest player_position_request = 1301;
    // Hechizo con proyectil esquivable: el server decide el impacto (ver ProjectileLaunchRequest).
    ProjectileLaunchRequest projectile_launch_request = 1302;
    // Casa de subastas (ver docs/SUBASTAS.md). Rango propio de tags desde 300.
    AuctionRequest auction_request = 300;
    // Depósito por cuenta (ver docs/DEPOSITO.md). Rango propio de tags desde 400.
    DepositRequest deposit_request = 400;
    // Volver a la ciudad (recall). Rango propio de tags desde 500.
    RecallRequest recall_request = 500;
    // Party (ver docs/PARTY_Y_ARENAS.md). Rango propio de tags desde 600.
    PartyRequest party_request = 600;
    // Puntos de stats del personaje (ver docs/PLAN_DE_TRABAJO.md paso 1.2). Rango propio de tags desde 700.
    StatAllocRequest stat_alloc_request = 700;
    // Chat por canales (apps/server/src/systems/chat.ts). Rango propio de tags desde 800.
    ClientChatMessage client_chat_message = 800;
    // Botín de materiales / oro en el suelo (apps/server/src/systems/loot.ts). Rango propio de tags desde 900.
    ClientPickupItem client_pickup_item = 900;
    // Dar e Intercambiar entre jugadores (ver docs/INTERCAMBIO.md). Rango propio de tags desde 1300.
    TradeRequest trade_request = 1300;
    // Guilds (ver docs/GUILDS.md). Rango propio de tags desde 1500.
    GuildRequest guild_request = 1500;
  }
  // P0-A: el cliente ya no fija números de combate (velocidad de movimiento, de ataque, de casteo, alcance, daño, stun).
  // Los calcula el server. Tags retirados: no reutilizar.
  reserved 4, 18, 19, 20, 21, 27;
}

message WeatherChangeRequest {
  WeatherMode weather = 1;
}

message WeatherChanged {
  WeatherMode weather = 1;
}

message CreateItemRequest {
  int32 item_id = 1;
  repeated ItemEffectEntry effect_overrides = 2;
}

message MoveItemInBagRequest {
  int64 item_uid = 1;
  optional int32 bag_x = 2;
  optional int32 bag_y = 3;
}

message EquipItemRequest {
  int64 item_uid = 1;
  optional string target_slot = 2;
}

message UnequipItemRequest {
  string slot = 1;
  int64 item_uid = 2;
  optional int32 bag_x = 3;
  optional int32 bag_y = 4;
}

message ConsumeItemRequest {
  int64 item_uid = 1;
}

message ChangePlayerAppearanceRequest {
  PlayerGender gender = 1;
  PlayerSkinColor skin_color = 2;
  // Hair style index 0–7 (client Style 1–8; index 2 = no hair).
  int32 hair_style_index = 3;
  // Underwear palette index 0–7.
  int32 underwear_color_index = 4;
}

message PlayerItemDropRequested {
  int64 item_uid = 1;
}

message PlayerItemPickupRequested {
}

message ChangePlayerAttackTypeRequest {
  // Persisted local-player hit mode selection mirrored back to the UI; matches server AttackType / client AttackType values.
  int32 attack_type = 1;
}

message ChangePlayerAllowDashAttackRequest {
  // Persisted local-player dash-attack preference mirrored back to the UI.
  bool allow_dash_attack = 1;
}

message SpellCastStartRequest {
  int32 spell_id = 1;
  // Id del hechizo ('proyectil', 'paralisis'...). El server arranca el cast con SU cast time; el golpe que llegue antes se descarta.
  string spell = 2;
}

message SpellCastCancelRequest {
}

message SpellCastRequest {
  int32 x = 1;
  int32 y = 2;
  optional int64 player_id = 3;
  optional int64 monster_id = 4;
}

// Viaje por el menú de waypoints: id = 'city' (volver a la ciudad de tu facción) o el id de una zona de entrenamiento.
/** Cruzar un vínculo entre mapas. El id es estable (no depende de coordenadas); el server valida distancia, requisitos y estado. */
message PortalRequest { string portal_id = 1; }
/** El cliente terminó de armar el mapa `map_id` (con el hash que calculó). El server recién ahí mete al jugador en el mundo nuevo. */
message MapReady {
  string map_id = 1;
  string map_hash = 2;
  uint32 channel_id = 3;  // MVP: siempre 0
}

message WaypointRequest {
  string id = 1;
}

message PlayerTeleportRequested {
  int32 x = 1;
  int32 y = 2;
}

message KillAllMonstersRequested {
}

message PlayerBowStanceRequested {
  int32 direction = 1;
}

message PlayerPickupRequested {
  int32 direction = 1;
}

message PlayerResurrectedRequest {
}

message PlayerAttackedMonsterRequest {
  int64 monster_id = 1;
  bool ranged_attack = 2;
  // Player attack mode vs monsters (server AttackType). Matches client AttackType enum values.
  int32 attack_type = 3;
}

message PlayerAttackedPlayerRequest {
  int64 target_player_id = 1;
  bool ranged_attack = 2;
  // Player attack mode vs players (server AttackType). Matches client AttackType enum values.
  int32 attack_type = 3;
}

message SummonMonsterRequested {
  string sprite = 1;
  int32 movement_speed_ms = 2;
  // Facing in world grid terms; matches client Direction enum (0=North .. 7=NorthWest).
  int32 direction = 3;
  // Monster melee hit mode on players; matches server AttackType / client AttackType enum values.
  int32 attack_type = 4;
  // Stunlock duration on players for Stun/Knockback hit modes (ms); server accepts 100–2000.
  int32 stun_duration_ms = 5;
  // Max HP at spawn (current HP equals max); server accepts 1–1000 to match summon dialog slider.
  int32 max_hp = 6;
  // Melee damage roll (min and max both set to this); server accepts 1–1000 to match summon dialog damage slider.
  int32 attack_damage = 7;
  // Full melee swing duration in ms (200 = fast … 2000 = slow); matches summon dialog attack speed slider.
  int32 attack_speed_ms = 8;
  // Idle gate after damage resolves: ms added with half swing; 0 = no extra recovery. Matches `GameWorldMonster.AttackRecoveryMs`.
  optional int32 attack_recovery_ms = 9;
  // Max Chebyshev chase distance before abandoning target (cells); summon dialog 1–20. Matches `GameWorldMonster.ChaseMaxDistanceCells`.
  optional int32 chase_range_cells = 10;
  // Chebyshev cells within which the monster melee-attacks instead of stepping closer; summon dialog 1–20. Matches `GameWorldMonster.AttackRangeCells`.
  optional int32 attack_range_cells = 11;
  // Monster hostility mode: 0 = Hostile, 1 = Neutral, 2 = Friendly.
  int32 allegiance = 12;
  // How many monsters to spawn (1–1000); server places each on a free cell near the player until empty or failure.
  int32 summon_count = 13;
}

message ChangePlayerIdleDirectionRequest {
  int32 direction = 1;
}

message LogoutCancelledRequest {
}

message AuthenticateRequest {
  string id = 1;
  /** Nombre de la CUENTA (usuario). Los personajes se eligen después con SelectCharacterRequest. */
  string character_name = 2;
  /** Cuenta: si el nombre no existe se crea con esta contraseña; si existe tiene que coincidir. */
  string password = 3;
}

/** Crea un personaje en la cuenta (máximo 3). El server responde con CharacterList (con `error` si no se pudo). */
message CreateCharacterRequest {
  string name = 1;
  string cls = 2;
  string faction = 3;
}
/** Entra al mundo con uno de los personajes de la cuenta. */
message SelectCharacterRequest {
  string name = 1;
}
/** Borra un personaje de la cuenta. `name` tiene que coincidir con el del personaje. */
message DeleteCharacterRequest {
  string name = 1;
}

message LogoutRequest {
}

message LogoutResponse {
  int32 wait = 1;
}

/** Server pushes this when a pending timed logout is invalidated (e.g. combat damage). */
message LogoutCancelled {
}

message PlayerMovementStateChangeRequest {
  bool running_mode = 1;
}

message PlayerAttackModeChangeRequest {
  bool attack_mode = 1;
}

message PlayerMovementStateChanged {
  int64 player_id = 1;
  bool running_mode = 2;
  int32 movement_speed_ms = 3;
}

message PlayerAttackModeChanged {
  int64 player_id = 1;
  bool attack_mode = 2;
}

message PlayerDisconnected {
  int64 player_id = 1;
}

message PlayerReconnected {
  int64 player_id = 1;
}

message MakeServerCellOccupiedRequest {
  int32 x = 1;
  int32 y = 2;
}

message RequestMovement {
  int32 cur_x = 1;
  int32 cur_y = 2;
  int32 dest_x = 3;
  int32 dest_y = 4;
  string game_world_id = 5;
  bool dash_attack = 6;
  optional int64 monster_id = 7;
  optional int32 attack_type = 8;
  optional int64 player_id = 9;
}

message WorldChangeRequest {
  string world_id = 1;
  string game_world_id = 2;
  bool validate_teleport = 3;
}

message WorldLocation {
  int32 x = 1;
  int32 y = 2;
}

message TeleportTarget {
  string world_id = 1;
  string map_name = 2;
  WorldLocation loc = 3;
  uint32 channel_id = 4;  // MVP: siempre 0
}

message TeleportLocationSet {
  repeated WorldLocation locs = 1;
  TeleportTarget target = 2;
}

message GroundEffectEntry {
  int64 ground_effect_id = 1;
  GroundEffectType effect_type = 2;
}

message GroundItemEntry {
  int32 item_id = 1;
  int64 item_uid = 2;
  optional int32 quantity = 3;
  repeated ItemEffectEntry effect_overrides = 4;
}

message GroundStateCell {
  WorldLocation loc = 1;
  repeated GroundEffectEntry effects = 2;
  optional GroundItemEntry ground_item = 3;
}

message GroundStateCellRemoved {
  WorldLocation loc = 1;
  repeated int64 ground_effect_ids = 2;
  optional int64 ground_item_uid = 3;
}

message GroundStatesEnteredRange {
  repeated GroundStateCell states = 1;
}

message GroundStatesLeftRange {
  repeated GroundStateCellRemoved states = 1;
}

message ServerMessage {
  oneof payload {
    PingResponse ping_response = 1;
    InitialGameWorldState initial_game_world_state = 2;
    ResetPosition reset_position = 3;
    PositionCorrected position_corrected = 4;
    PlayersEnteredRange players_entered_range = 5;
    PlayersLeftRange players_left_range = 6;
    PlayerMoved player_moved = 7;
    PlayerMovementStateChanged player_movement_state_changed = 8;
    SendMessage send_message = 9;
    PlayerParalyzed player_paralyzed = 10;
    LogoutResponse logout_response = 11;
    PlayerDisconnected player_disconnected = 12;
    PlayerReconnected player_reconnected = 13;
    WorldsList worlds_list = 14;
    SpawnProtectionEnabled spawn_protection_enabled = 15;
    SpawnProtectionDisabled spawn_protection_disabled = 16;
    PlayerAttackModeChanged player_attack_mode_changed = 17;
    PlayerIdleDirectionChanged player_idle_direction_changed = 18;
    MonstersList monsters_list = 19;
    MonstersEnteredRange monsters_entered_range = 20;
    MonstersLeftRange monsters_left_range = 21;
    MonsterMoved monster_moved = 22;
    MonsterAttacked monster_attacked = 23;
    PlayerReceiveDamage player_receive_damage = 24;
    MonsterTakeDamage monster_take_damage = 25;
    // Other players' attack animation sync (melee or bow); bow includes monster_id for arrow VFX.
    PlayerAttackedMonster player_attacked_monster = 26;
    MonsterDied monster_died = 27;
    HpUpdated hp_updated = 28;
    PlayerDied player_died = 29;
    PlayerResurrected player_resurrected = 30;
    PlayerPickupPerformed player_pickup_performed = 31;
    PlayerBowStancePerformed player_bow_stance_performed = 32;
    PlayerAttackedPlayer player_attacked_player = 33;
    PlayerTakeDamage player_take_damage = 34;
    MonsterAttackedMonster monster_attacked_monster = 35;
    MonsterTakeDamageByMonster monster_take_damage_by_monster = 36;
    PlayerTeleported player_teleported = 37;
    InitialState initial_state = 38;
    SpellCastStarted spell_cast_started = 39;
    SpellCastCancelled spell_cast_cancelled = 40;
    CastAoeSpell cast_aoe_spell = 41;
    CastDirectionalAoeSpell cast_directional_aoe_spell = 42;
    // Self only: cast request arrived before cast bar interval (anti-cheat / desync).
    SpellCastFailed spell_cast_failed = 43;
    GroundStatesEnteredRange ground_states_entered_range = 44;
    GroundStatesLeftRange ground_states_left_range = 45;
    ItemAddedToBag item_added_to_bag = 46;
    ItemRemovedFromBag item_removed_from_bag = 47;
    ItemMovedInBag item_moved_in_bag = 48;
    ItemEquipped item_equipped = 49;
    ItemUnequipped item_unequipped = 50;
    PlayerAppearanceChanged player_appearance_changed = 51;
    ChatMessageReceived chat_message_received = 52;
    MonsterCastAoeSpell monster_cast_aoe_spell = 53;
    MonsterCastDirectionalAoeSpell monster_cast_directional_aoe_spell = 54;
    TemporaryEffectApplied temporary_effect_applied = 55;
    TemporaryEffectExpired temporary_effect_expired = 56;
    /** Plays a one-shot effect at a grid cell (e.g. buff cast VFX). */
    CastEffect cast_effect = 59;
    WeatherChanged weather_changed = 60;
    NpcsEnteredRange npcs_entered_range = 61;
    NpcsLeftRange npcs_left_range = 62;
    LogoutCancelled logout_cancelled = 63;
    PlayerProfileChanged player_profile_changed = 64;
    PvpHit pvp_hit = 65;
    SkillEffect skill_effect = 66;
    CharacterLoaded character_loaded = 80;
    CharacterList character_list = 1400;
    // Movimiento libre: posición decimal de un jugador que veo (ver PlayerPositionUpdate).
    PlayerPositionUpdate player_position_update = 1401;
    // Un jugador lanzó un proyectil esquivable (visual; el daño lo decide el server al llegar).
    PlayerProjectile player_projectile = 1402;
    MobsSnapshot mobs_snapshot = 120;
    MobDamaged mob_damaged = 121;
    MobAttack mob_attack = 122;
    MobHitPlayer mob_hit_player = 123;
    MobSpecialEvent mob_special_event = 124;
    MobDied mob_died = 125;
    LootRoll loot_roll = 130;
    StatusUpdate status_update = 131;
    Vitals vitals = 132;
    PlayerVitals player_vitals = 133;
    PvpKill pvp_kill = 134;
    InventoryState inventory_state = 140;
    EconResult econ_result = 141;
    KillReward kill_reward = 142;
    GroundItemSpawned ground_item_spawned = 143;
    GroundItemRemoved ground_item_removed = 144;
    // Cambio de mapa: el server sacó al jugador del mundo viejo y espera MapReady para meterlo en el nuevo.
    MapTransfer map_transfer = 150;
    // Proyectil de un mob a distancia (docs/MOBS_A_DISTANCIA.md). Los mobs cuerpo a cuerpo siguen usando MobAttack + MobHitPlayer.
    MobProjectile mob_projectile = 151;
    // Casa de subastas (ver docs/SUBASTAS.md). Rango propio de tags desde 300; el resultado de cada acción va en EconResult.
    AuctionSearchResult auction_search_result = 300;
    AuctionMyState auction_my_state = 301;
    AuctionHistory auction_history = 302;
    // Depósito por cuenta (ver docs/DEPOSITO.md). Rango propio de tags desde 400; el resultado de cada acción va en EconResult.
    DepositState deposit_state = 400;
    // Volver a la ciudad (recall). Rango propio de tags desde 500.
    RecallState recall_state = 500;
    // Party (ver docs/PARTY_Y_ARENAS.md). Rango propio de tags desde 600.
    PartyState party_state = 600;
    PartyInvited party_invited = 601;
    ArenaInvited arena_invited = 603;
    ArenaInfo arena_info = 604;
    PartyStatsUpdate party_stats_update = 602;
    // Texto flotante de combate (daño / cura). Rango propio de tags desde 700.
    CombatTextEvent combat_text_event = 700;
    // Chat por canales. Rango propio de tags desde 800.
    ServerChatMessage server_chat_message = 800;
    // Botín de materiales / oro en el suelo. Rango propio de tags desde 900.
    LootSpawnEvent loot_spawn_event = 900;
    ServerItemPickedUp server_item_picked_up = 901;
    // Canal y recarga de una habilidad común (Segundo aliento) o del bloqueo de pociones (K6). Rango propio de tags desde 1000.
    AbilityState ability_state = 1000;
    // Motor de jefes (docs/JEFES.md). Rango propio de tags desde 1100.
    BossCast boss_cast = 1100;
    BossCastEnd boss_cast_end = 1101;
    BossTelegraph boss_telegraph = 1102;
    BossZone boss_zone = 1103;
    BossPhase boss_phase = 1104;
    // Oferta del día de la tienda (docs/ITEMS.md): global, rota por día UTC; la estrella tiene stock 1 en todo el server. Rango desde 1200.
    DailyShopState daily_shop_state = 1200;
    // Dar e Intercambiar entre jugadores (ver docs/INTERCAMBIO.md). Rango propio de tags desde 1300.
    TradeState trade_state = 1300;
    TradeInvite trade_invite = 1301;
    // Guilds (ver docs/GUILDS.md). Rango propio de tags desde 1500.
    GuildState guild_state = 1500;
    GuildInvited guild_invited = 1501;
  }
}

// Estado de una habilidad para el que la usa (K6). id: 'aliento' (Segundo aliento) o 'pocion' (bloqueo compartido de pociones).
// channeling: está canalizando; channel_ms = duración total del canal y remaining_ms lo que falta.
// cooldown_ms = cuánto falta para poder usarla de nuevo y cooldown_total_ms la recarga completa (para dibujar el reloj).
// reason: por qué se cortó o se rechazó ('' si no hay nada que avisar).
message AbilityState {
  string id = 1;
  bool channeling = 2;
  int32 channel_ms = 3;
  int32 remaining_ms = 4;
  int32 cooldown_ms = 5;
  int32 cooldown_total_ms = 6;
  string reason = 7;
}

// Botín que cae al suelo al morir un mob (server-autoritativo). Lo reciben los jugadores en rango de visión.
message LootSpawnEvent {
  string loot_id = 1;      // ID único del botín en el suelo
  int32 x = 2;             // Celda donde cae
  int32 y = 3;
  string item_id = 4;      // Ej: "viper_skin" ("gold" = oro)
  string item_name = 5;    // Ej: "Viper Skin"
  int32 amount = 6;        // Cantidad
}

// El cliente pide levantar un botín (a 1,5 celdas o menos).
message ClientPickupItem {
  string loot_id = 1;
}

// Alguien levantó el botín: el cliente lo saca del suelo. player_id vacío = venció (nadie lo levantó).
message ServerItemPickedUp {
  string loot_id = 1;
  string player_id = 2;    // player_id en decimal de quien lo levantó
  string item_name = 3;
  int32 amount = 4;
  string player_name = 5;  // nombre del personaje (para "[Nombre] obtuvo [Item]" en el chat de party)
}

// Número de combate para el texto flotante. Lo reciben solo los jugadores en rango de visión del objetivo.
// IDs: jugador = su player_id en decimal ("42"); mob = "m" + mob id ("m17"). source_id vacío = sin autor (veneno, poción).
message CombatTextEvent {
  string target_id = 1;    // A quién le pegan o a quién curan
  string source_id = 2;    // Quién hace el daño o la cura
  int32 amount = 3;        // El número (ej: 326)
  bool is_heal = 4;        // true = verde (+), false = daño
  string spell_name = 5;   // id del hechizo (ej: "proyectil"); vacío = golpe básico / sin cartel
  string spell_icon = 6;   // id del ícono para buscarlo en el cliente
}

// Party: el cliente manda una acción ('invite', 'accept', 'decline', 'leave', 'kick', 'leader') con el nombre del otro jugador cuando hace falta.
// El nombre del personaje es el identificador del jugador en todo el sistema de party.
message PartyRequest {
  string action = 1;
  string name = 2;
}

message PartyMember {
  string name = 1;
  int32 level = 2;
  int32 hp = 3;
  int32 max_hp = 4;
  string map = 5;
  bool leader = 6;
  bool online = 7;
  int32 mp = 8;
  int32 max_mp = 9;
}

// Estado completo de la party (al entrar, salir, expulsar o cambiar líder). Sin miembros = no tiene party.
message PartyState {
  repeated PartyMember members = 1;
  string party_id = 2;
}

// Te invitaron a una party.
message PartyInvited {
  string from_name = 1;
  int64 expires_ms = 2;
  string party_id = 3;
}

// Hay partida de arena: la party tiene hasta expires_ms para aceptar (/arena aceptar) o rechazar.
message ArenaInvited {
  string mode = 1;       // "2v2" | "3v3"
  int64 expires_ms = 2;  // epoch ms
  string arena = 3;      // nombre de la arena sorteada
}

// Estado de la arena para la ventana del cliente (respuesta a "/arena info").
message ArenaRating { string mode = 1; int32 rating = 2; int32 wins = 3; int32 losses = 4; int32 draws = 5; int32 games_left = 6; }
message ArenaRank { string mode = 1; int32 pos = 2; string name = 3; int32 rating = 4; int32 wins = 5; int32 losses = 6; int32 draws = 7; }
message ArenaInfo {
  string season = 1;
  string state = 2;            // "" | "cola" | "invitacion" | "partida"
  string queued_mode = 3;      // en cola: "2v2" | "3v3"
  int64 queued_ms = 4;         // en cola: hace cuánto
  int32 queued_parties = 5;    // en cola: parties esperando en ese modo
  string match_phase = 6;      // en partida: "prep" | "fight" | "end"
  int64 penalty_ms = 7;        // > 0: penalizado, cuánto falta
  int32 party_size = 8;        // tamaño de tu party (0 = sin party)
  bool leader = 9;             // sos el líder (o no tenés party)
  repeated ArenaRating ratings = 10;
  repeated ArenaRank top = 11; // ranking de los dos modos
  int32 ranked_min = 12;       // partidas para entrar al ranking
}

// Solo los stats de un compañero, para no mandar el estado completo en cada golpe o regen.
message PartyStatsUpdate {
  string name = 1;
  int32 hp = 2;
  int32 mp = 3;
}

message TemporaryEffectApplied {
  TemporaryEffectEntityKind entity_kind = 1;
  int64 entity_id = 2;
  TemporaryEffectType temporary_effect_type = 3;
  // Authoritative effective ms after this event; cast omitted for monsters.
  optional int32 movement_speed_ms = 4;
  optional int32 attack_speed_ms = 5;
  optional int32 cast_speed_ms = 6;
}

message TemporaryEffectExpired {
  TemporaryEffectEntityKind entity_kind = 1;
  int64 entity_id = 2;
  TemporaryEffectType temporary_effect_type = 3;
  optional int32 movement_speed_ms = 4;
  optional int32 attack_speed_ms = 5;
  optional int32 cast_speed_ms = 6;
}

/** One-shot effect at a world cell; `effect_key` matches client `Effects.ts` keys (e.g. `invisibility`). */
message CastEffect {
  string game_world_id = 1;
  string effect_key = 2;
  int32 x = 3;
  int32 y = 4;
}

message SpellCastFailed {
}

/** El cliente avisa su bando, clase y equipo visible: "bando;clase;pieza,pieza,...". */
/** PvP entre jugadores: el cliente que lanza avisa un efecto y, si hay target_id, daño/parálisis para ese jugador. */
/** target_id 0 = uno mismo (1,5 s); un aliado cerca (1 s). */
message RemoverRequest { int64 target_id = 1; }
message InvisibilityRequest {}
message DetectInvisibleRequest {}
message LootAttr { string key = 1; int32 value = 2; }
/** Botín tirado por el server para quien dio el golpe final. */
message LootRoll { int32 mob_id = 1; int32 rarity = 2; int32 base_seed = 3; repeated LootAttr attrs = 4; }
/** warcry = Bendición de poder activa (K8; el campo queda por compatibilidad). buffs = bendiciones y auras activas (K8): poder, amparo, intelecto, fortaleza, espiritu, represalia, clarividencia. */
message StatusUpdate { int64 player_id = 1; bool invisible = 2; bool detect = 3; bool fury = 4; bool warcry = 5; bool slow = 6; bool blessed = 7; bool poisoned = 8; repeated string buffs = 9; }
/** Mago: Blink (máx. 7 celdas) o clérigo: Paso de luz (máx. 6) a la celda (x, y). El server valida y responde con PlayerTeleported + SkillEffect. */
message BlinkRequest { int32 x = 1; int32 y = 2; /** '' o 'blink' = Parpadeo del mago; 'pasoluz' = Paso de luz del clérigo (K8). */ string skill = 3; }
/** Habilidades de clase: carga, giro, grito, nova, mandato, aura, las del clérigo (curacion, renovar, bendicion, novasagrada, orbe) y las de K8
 *  (represalia, escudodivino, amparo, escudomana, clarividencia, intelecto, guardian, esfera, despertar, grupo).
 *  carga necesita target_id (jugador) o mob_id; las curas del clérigo, target_id del aliado (0 = a sí mismo); renovar a un enemigo, target_id o mob_id. */
message SkillRequest { string skill = 1; int64 target_id = 2; int32 mob_id = 3; }
/** Efecto de una habilidad de clase para el que la usó (ok=false si el server la rechazó) y los cercanos. */
message SkillEffect { int64 caster_id = 1; string skill = 2; int32 from_x = 3; int32 from_y = 4; int32 to_x = 5; int32 to_y = 6; bool ok = 7; }
/** El cliente informa su vida (curas, pociones, regeneración); el server solo acepta subas razonables. */
message HpReport {
  int32 hp = 1;
  // Maná: lo gastado desde el último reporte en hechizos que el server no cobra por su cuenta (curas, hechizos a mobs),
  // el maná que el cliente cree tener (solo se acepta una suba por poción, con tope) y si está meditando.
  int32 mp_spent = 2;
  int32 mp = 3;
  bool meditating = 4;
}
message RespawnRequest {}
/** Tomar una poción (kind: 0 = vida, 1 = maná). El server valida el delay global (GCD) y cura: 20 % al instante y el resto en 2 s (vida). */
message PotionRequest { int32 kind = 1; }
/** Mi vida según el server (la autoridad): después de cada golpe, curación o al revivir. */
/** shield = puntos de escudo que absorben daño antes que la vida (K8). */
message Vitals { int32 hp = 1; int32 max_hp = 2; bool dead = 3; int32 mp = 4; int32 max_mp = 5; int32 shield = 6; }
/** Vida de otro jugador cercano (para su barra). */
message PlayerVitals { int64 player_id = 1; int32 hp = 2; int32 max_hp = 3; int32 shield = 4; }
message PvpKill { int64 player_id = 1; int64 killer_id = 2; string victim_name = 3; string killer_name = 4; }
message PvpHitRequest {
  string fx = 1;
  double x = 2;
  double y = 3;
  int64 target_id = 4;
  int32 dmg = 5;
  double secs = 6;
  double r = 7;
  // hechizo que lanza (el daño lo calcula el server)
  string spell = 8;
}
message PvpHit {
  int64 caster_id = 1;
  string fx = 2;
  double x = 3;
  double y = 4;
  int64 target_id = 5;
  int32 dmg = 6;
  double secs = 7;
  double r = 8;
}
/** Progreso del personaje (JSON validado por el server) para guardarlo en la cuenta. */
message SaveCharacterRequest {
