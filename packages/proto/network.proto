  float y = 2;
}

// El server repite a los que lo ven la posición decimal de un jugador (≈10 por segundo mientras se mueve).
message PlayerPositionUpdate {
  int64 player_id = 1;
  float x = 2;
  float y = 3;
}

message ResetPosition {
  int32 x = 1;
  int32 y = 2;
  string game_world_id = 3;
  int32 remaining_stunlock_ms = 4;
}

message PositionCorrected {
  int32 cur_x = 1;
  int32 cur_y = 2;
  int32 dest_x = 3;
  int32 dest_y = 4;
  string game_world_id = 5;
}

// Sent on every map load / world snapshot; character stats and spells live in InitialState (once per session when needed).
message InitialGameWorldState {
  string game_world_id = 1;
  string map_name = 2;
  int32 player_x = 3;
  int32 player_y = 4;
  repeated TeleportLocationSet teleport_locs = 5;
  string music_file = 6;
  bool dead = 7;
  // Authoritative local player grid facing; matches client Direction (0=North .. 7=NorthWest).
  int32 player_direction = 8;
  WeatherMode weather = 9;
}

/**
 * El server sacó al jugador del mundo anterior: el cliente muestra la pantalla de carga, arma el mapa `map_id`,
 * verifica que `map_hash` coincida con el que generó y contesta MapReady. Después llega InitialGameWorldState.
 */
message MapTransfer {
  string map_id = 1;
  string name = 2;
  // Celda de llegada y dirección (misma convención que InitialGameWorldState).
  int32 x = 3;
  int32 y = 4;
  int32 direction = 5;
  // Hash del mapa (FNV-1a de tamaño, bloqueos y zonas): detecta un cliente desactualizado.
  string map_hash = 6;
  string music_file = 7;
  // Id del mundo (mapa + instancia) donde va a aparecer: es el que el cliente manda en RequestMovement.game_world_id.
  string game_world_id = 8;
  // Rango de nivel recomendado (0 = sin dato) para la pantalla de carga.
  int32 lvl_min = 9;
  int32 lvl_max = 10;
}

message PingRequest {
  uint32 sequence = 1;
}

message PingResponse {
  uint32 sequence = 1;
  int32 game_world_queue_length = 2;
  int32 players_in_map = 3;
  double ping_variance = 4;
}

// ---------- PvE autoritativo: el server maneja los mobs ----------
/** El cliente avisa un golpe/hechizo propio contra un mob; el server valida rango, ritmo y tope de daño. */
message MobHitRequest {
  int32 mob_id = 1;
  int32 dmg = 2;
  bool melee = 3;
  bool crit = 4;
  double par_secs = 5;
  double poison_secs = 6;
  /** Hechizo o ataque ('ataque', 'golpe', 'bola'...). Desde el paso 1.3 el server calcula el daño, el crítico, el veneno y el robo de vida: `dmg`, `crit` y `poison_secs` se ignoran. */
  string spell = 7;
}
/** Estado del jugador que el server necesita para los mobs (si murió, nivel para el tope de daño). */
message PveStatusRequest {
  bool dead = 1;
  int32 lvl = 2;
}
message MobSnap {
  int32 id = 1;
  int32 type = 2;
  int32 zone = 3;
  float x = 4;
  float y = 5;
  int32 hp = 6;
  float par = 7;
  float imm = 8;
  bool poison = 9;
  bool moving = 10;
  /** Rasgos del mob (máscara de bits, ver packages/world/src/mobTraits.ts): mutante, anti-físico, anti-mágico, tóxico, explosivo, salvaje. */
  int32 traits = 11;
  /** Vida máxima real (rasgos y escalado por party de las mazmorras incluidos). 0 = el cliente la calcula como antes. */
  int32 hp_max = 12;
}
/** Mobs a la vista del jugador, 10 veces por segundo. */
message MobsSnapshot {
  repeated MobSnap mobs = 1;
}
message MobDamaged {
  int32 mob_id = 1;
  int64 attacker_id = 2;
  int32 dmg = 3;
  bool crit = 4;
  int32 hp = 5;
}
/** El mob levanta el arma hacia (tx, ty) (animación para todos). */
message MobAttack {
  int32 mob_id = 1;
  float tx = 2;
  float ty = 3;
}
/** Un mob a distancia dispara: el proyectil sale de (from_x, from_y), llega a (to_x, to_y) en travel_ms y es solo visual; el daño lo decide el server al llegar (MobHitPlayer). kind: 0 flecha, 1 virote. */
message MobProjectile {
  int32 mob_id = 1;
  float from_x = 2;
  float from_y = 3;
  float to_x = 4;
  float to_y = 5;
  int32 travel_ms = 6;
  int32 kind = 7;
}
/** Solo para el jugador golpeado: daño (antes de defensa) y/o inmovilización en segundos. */
message MobHitPlayer {
  int32 mob_id = 1;
  int32 dmg = 2;
  double stun = 3;
}
/** Habilidad de boss: fase 0 = aviso (carga 0,8 s), fase 1 = estallido en (x, y). */
message MobSpecialEvent {
  int32 mob_id = 1;
  int32 phase = 2;
  float x = 3;
  float y = 4;
}
message MobDied {
  int32 mob_id = 1;
  int64 killer_id = 2;
  float x = 3;
  float y = 4;
  int32 type = 5;
  int32 zone = 6;
}

// ---------- Economía autoritativa: oro, bolsa, equipo, nivel, pociones y misiones son del server ----------
/** Comprar la línea `stock_index` del stock del vendedor `npc_id` (el precio y el stock salen de la tabla compartida de packages/world). */
message EconBuyRequest { string npc_id = 1; int32 stock_index = 2; }
/** Vender un item de la bolsa (por uid de instancia) al vendedor `npc_id`. */
message EconSellRequest { string npc_id = 1; int32 uid = 2; }
/** Equipar un item de la bolsa (el que estaba puesto en ese slot vuelve a la bolsa). */
message EconEquipRequest { int32 uid = 1; }
/** Sacar el item de un slot (arma | armadura | cabeza | anillo) a la bolsa. */
message EconUnequipRequest { string slot = 1; }
/** Tirar (destruir) un item de la bolsa. */
message EconDropRequest { int32 uid = 1; }
/** Ordenar la bolsa (por slot, rareza y nombre). */
message EconSortRequest {}
/** Misiones del Capitán: action = accept | turnin | forge (forge usa key = cripta | foso). */
message EconQuestRequest { string npc_id = 1; string action = 2; string key = 3; }

message InvAttr { string id = 1; int32 v = 2; }
/** Item con identidad: uid único por personaje, base (nombre en la tabla de bases), rareza 0..3 y atributos. */
message InvItem { int32 uid = 1; string base = 2; int32 rarity = 3; repeated InvAttr attrs = 4; /* nivel de mejora (+N) */ int32 up = 5; /* reforjas hechas (el costo de la próxima se duplica con cada una) */ int32 rf = 6; }
/** Una línea de la oferta del día: `star` es el único caro con el roll ya tirado (visible); `sold` solo para la estrella. */
message DailyOffer { string base = 1; int32 quality = 2; repeated InvAttr attrs = 3; int32 price = 4; bool star = 5; bool sold = 6; }
/** La oferta del día completa (igual para todos; se compra con EconBuyRequest y stockIndex = 1000 + índice, en el mercader). */
message DailyShopState { repeated DailyOffer offers = 1; }
message EconUpgradeRequest { string npc_id = 1; int32 uid = 2; }
/** Reforja del extra número `extra` (0 o 1, contando desde el final de los fijos) del ítem `uid` en el herrero. */
message EconReforgeRequest { string npc_id = 1; int32 uid = 2; int32 extra = 3; }
/** Repartir puntos de stats: action = "add" (suma `points` al stat `stat`: str, vit, dex, mag o luk) o "reset" (devuelve todos los puntos). El server valida todo. */
message StatAllocRequest { string action = 1; string stat = 2; int32 points = 3; }
message InvEquip { string slot = 1; InvItem item = 2; }
/** Foto completa del estado económico del personaje según el server. Se manda al entrar y después de cada cambio. */
message InventoryState {
  int32 gold = 1;
  int32 lvl = 2;
  int32 exp = 3;
  repeated InvItem bag = 4;
  repeated InvEquip eq = 5;
  int32 pots_hp = 6;
  int32 pots_mp = 7;
  int32 quest_i = 8;
  string quest_state = 9;
  int32 quest_prog = 10;
  int32 keys_cripta = 11;
  int32 keys_foso = 12;
  int32 shards_cripta = 13;
  int32 shards_foso = 14;
  repeated string unlocked = 15;
  string cls = 16;
  string faction = 17;
  // Oro real (puede pasar de 2^31: `gold` queda topado a int32 solo por compatibilidad; el cliente usa gold_d).
  double gold_d = 18;
  // Piedras de forja (materiales para mejorar ítems únicos).
  int32 forge = 19;
  // Puntos de stats repartidos y puntos libres (paso 1.2). Los stats de las cuentas viejas valen 10.
  int32 stat_str = 20;
  int32 stat_vit = 21;
  int32 stat_dex = 22;
  int32 stat_mag = 23;
  int32 stat_luk = 24;
  int32 stat_free = 25;
  // Misiones del corte del MVP (cadena, encargos del día y materiales): JSON de QuestBookView (@fdn/world quests.ts).
  string quest_book = 26;
  // Inteligencia: se eliminó en D.3. El tag no se reutiliza ni se renumera; el server ya no lo manda (queda en 0).
  int32 stat_int = 27;
  // Topes de DF y RM de atributos de ítems de esta semana del server (D.6) y cuándo suben (ms UTC; 0 = ya están en el máximo).
  int32 cap_df = 28;
  int32 cap_rm = 29;
  int64 cap_next_at = 30;
}
/** Respuesta a una acción de economía: ok=false con un motivo (code) y texto para mostrar. */
message EconResult { bool ok = 1; string code = 2; string text = 3; }
/** Lo que ganó quien dio el golpe final (ya aplicado en el server; InventoryState trae el estado nuevo). */
message KillReward {
  int32 mob_id = 1;
  double x = 2;
  double y = 3;
  int32 exp = 4;
  int32 gold = 5;
  InvItem item = 6;
  bool bag_full = 7;
  string potion = 8;
  string shard = 9;
  int32 new_lvl = 10;
  bool quest_ready = 11;
  int32 quest_prog = 12;
  double gold_d = 13;
  int32 forge = 14;
}

// ---------- Botín en el suelo (server-autoritativo; ver docs/ECONOMIA_SERVER.md) ----------
/** Recoger el item del suelo `id`: el server valida que exista, distancia <= 2 celdas, que sea tuyo (o ya libre) y que haya lugar en la bolsa. */
message PickupRequest { int32 id = 1; }
/** Aparece (o entra en rango) un item en el suelo. `locked`: todavía no podés recogerlo; `free_in_ms`: cuánto falta para que lo pueda recoger cualquiera; `expires_in_ms`: cuánto falta para que desaparezca. */
message GroundItemSpawned {
  int32 id = 1;
  InvItem item = 2;
  double x = 3;
  double y = 4;
  bool locked = 5;
  int32 free_in_ms = 6;
  int32 expires_in_ms = 7;
}
/** El item del suelo ya no está (lo recogieron, venció o salió de tu rango). */
message GroundItemRemoved { int32 id = 1; }

// ---------- Casa de subastas (ver docs/SUBASTAS.md) ----------
/** Filtros de búsqueda. 0 / vacío = sin filtro. rarity: 0 = todas, 1..4 = Común..Épico. sort: price_asc | price_desc | time_asc | time_desc. */
message AuctionQuery {
  string slot = 1;
  int32 rarity = 2;
  string text = 3;
  int32 lvl_min = 4;
  int32 lvl_max = 5;
  double max_price = 6;
  string sort = 7;
  int32 page = 8;
}
/**
 * Pedido al Subastador (npc_id: el NPC con el que se habla; el server valida la distancia).
 * action = open | search | post | cancel | buy | claim | history (pide el historial propio). post usa uid + price; cancel y buy, listing_id; claim, mail_id (0 = todo).
 */
message AuctionRequest {
  string npc_id = 1;
  string action = 2;
  AuctionQuery query = 3;
  int32 uid = 4;
  double price = 5;
  int32 listing_id = 6;
  int32 mail_id = 7;
}
message AuctionListing {
  int32 id = 1;
  InvItem item = 2;
  double price = 3;
  string seller = 4;
  /** Milisegundos hasta que vence. */
  double expires_in_ms = 5;
  /** La publicó quien recibe el mensaje. */
  bool mine = 6;
  /** Nivel del item (el de su base en las tiendas). */
  int32 lvl = 7;
}
message AuctionSearchResult {
  repeated AuctionListing listings = 1;
  int32 page = 2;
  int32 pages = 3;
  int32 total = 4;
}
/** Un reclamo del buzón: un item (vuelto o comprado) o el oro de una venta. */
message AuctionMail {
  int32 id = 1;
  InvItem item = 2;
  double gold = 3;
  string text = 4;
  double age_ms = 5;
}
/** Mis publicaciones activas y mi buzón. */
message AuctionMyState {
  repeated AuctionListing listings = 1;
  repeated AuctionMail mail = 2;
  int32 max_listings = 3;
}
/**
 * Una transacción del historial propio. kind = post | buy | sell | cancel | expire | claim.
 * amount: oro que entró (+) o salió (-) en esa transacción (0 si fue solo un item); price: precio de la publicación;
 * fee: tasa o comisión cobrada; other: la otra parte (comprador o vendedor), si hay.
 */
message AuctionHistoryEntry {
  int32 id = 1;
  string kind = 2;
  InvItem item = 3;
  double amount = 4;
  double price = 5;
  double fee = 6;
  string other = 7;
  /** Milisegundos desde que pasó (el cliente calcula la fecha con su reloj). */
  double age_ms = 8;
}
/** Historial de transacciones del que recibe el mensaje, del más nuevo al más viejo (máximo 200). */
message AuctionHistory {
  repeated AuctionHistoryEntry entries = 1;
}

// ---------- Depósito por cuenta (ver docs/DEPOSITO.md) ----------
/**
 * Pedido al Depositario (npc_id: el NPC con el que se habla; el server valida rol y distancia).
 * action = open | put | take | gold_in | gold_out | stack_in | stack_out | sort.
 * put: uid de la bolsa; take: uid del depósito; gold_in/gold_out: amount; stack_in/stack_out: stack + amount.
 * stack = pot_hp | pot_mp | key_cripta | key_foso | shard_cripta | shard_foso.
 * op_id: número de pedido elegido por el cliente (distinto de 0): si llega dos veces, la segunda no se aplica.
 */
message DepositRequest {
  string npc_id = 1;
  string action = 2;
  int32 uid = 3;
  double amount = 4;
  string stack = 5;
  uint32 op_id = 6;
  /** '' = depósito de la cuenta; 'guild' = cofre compartido de la guild (ver docs/GUILDS.md). */
  string scope = 7;
}
message DepositStack { string id = 1; int32 qty = 2; }
/** Contenido del depósito de la cuenta (se manda al abrir y después de cada acción). Con scope = 'guild' es el cofre de la guild. */
message DepositState {
  repeated InvItem items = 1;
  double gold = 2;
  repeated DepositStack stacks = 3;
  int32 capacity = 4;
  int32 stack_max = 5;
  string scope = 6;
  /** Cofre de guild: últimos movimientos ("Ana guardó Mandoble"), del más nuevo al más viejo. */
  repeated string log = 7;
  /** Cofre de guild: tu rango te deja retirar (líder y oficiales). */
  bool can_take = 8;
}

// ---------- Guilds (ver docs/GUILDS.md) ----------
/**
 * Pedido de guild. action:
 *   create  = crear (name = nombre de la guild, arg = etiqueta de 2 a 4 letras); cuesta oro y pide nivel mínimo.
 *   invite  = invitar al personaje `name` (líder y oficiales); accept / decline = responder a la invitación pendiente.
 *   leave   = salir; kick = expulsar a `name`; promote / demote = subir o bajar de rango a `name`; leader = ceder el liderazgo a `name`.
 *   crest   = cambiar el escudo (arg = "forma,fondo,figura,símbolo", índices); motd = cambiar el lema (arg); disband = disolver (solo el líder, cofre vacío).
 *   info    = pedir el estado (GuildState).
 */
message GuildRequest {
  string action = 1;
  string name = 2;
  string arg = 3;
}
message GuildMember {
  string name = 1;
  /** 'lider' | 'oficial' | 'miembro' */
  string rank = 2;
  bool online = 3;
  int32 level = 4;
  string cls = 5;
  string map = 6;
  /** Última conexión (epoch ms); 0 = conectado ahora. */
  int64 last_seen_ms = 7;
  int64 joined_ms = 8;
}
/** Estado completo de tu guild (al entrar, al cambiar algo y cuando se conecta o desconecta un miembro). id vacío = no tenés guild. */
message GuildState {
  string id = 1;
  string name = 2;
  string tag = 3;
  string faction = 4;
  /** "forma,fondo,figura,símbolo" (índices; el cliente dibuja el escudo). */
  string crest = 5;
  repeated GuildMember members = 6;
  int32 max_members = 7;
  string motd = 8;
  string my_rank = 9;
  int64 created_ms = 10;
}
/** Te invitaron a una guild. */
message GuildInvited {
  string from_name = 1;
  string guild_name = 2;
  string tag = 3;
  int64 expires_ms = 4;
}

// ---------- Dar e Intercambiar entre jugadores (ver docs/INTERCAMBIO.md) ----------
/**
 * Pedido de Dar / Intercambiar. Siempre es con un jugador que ves (mismo mapa, a rango); el server valida todo.
 * action:
 *   give      = regalo directo a `target_id`: un item de la bolsa (`uid`) o oro (`amount`), uno u otro. El receptor tiene que aceptar.
 *   offer     = invitar a `target_id` a intercambiar (abre la ventana cuando acepta).
 *   accept    = aceptar la invitación pendiente (de un regalo o de un intercambio).
 *   decline   = rechazar la invitación pendiente.
 *   add       = poner el item `uid` de tu bolsa en tu oferta (la ventana tiene que estar abierta).
 *   remove    = sacar el item `uid` de tu oferta.
 *   gold      = fijar el oro de tu oferta en `amount` (0 lo saca).
 *   confirm   = confirmar la oferta tal como está; cuando confirman los dos, se hace el cambio.
 *   cancel    = cerrar la ventana (o cancelar el regalo que ofreciste).
 * op_id: número elegido por el cliente (distinto de 0); si llega dos veces seguidas, la segunda no se aplica.
 */
message TradeRequest {
  string action = 1;
  int64 target_id = 2;
  int32 uid = 3;
  double amount = 4;
  uint32 op_id = 5;
}
/** Invitación pendiente para el receptor. kind = "give" (trae `item` o `gold`) o "exchange". */
message TradeInvite {
  string kind = 1;
  string from_name = 2;
  int64 from_id = 3;
  InvItem item = 4;
  double gold = 5;
  int64 expires_ms = 6;
}
/** Ventana de intercambio, igual de los dos lados (cada uno ve lo suyo como `mine`). open = false la cierra; `reason` dice por qué se cerró. */
message TradeState {
  bool open = 1;
  string partner = 2;
  repeated InvItem mine = 3;
  double my_gold = 4;
  bool my_confirmed = 5;
  repeated InvItem theirs = 6;
  double their_gold = 7;
  bool their_confirmed = 8;
  /** Uids de `theirs` agregados o cambiados después de la última confirmación del que mira: se marcan como "Nuevo". */
  repeated int32 theirs_new = 9;
  string reason = 10;
}

// Volver a la ciudad (recall estilo MMO clásico): el cliente pide empezar o cancelar; el server lleva el canal (8 s), lo corta si
// te movés, recibís daño, atacás o lanzás algo, y al terminar te lleva al hogar de tu facción. Enfriamiento de 60 s.
message RecallRequest {
  bool cancel = 1;
}

// Estado del recall para el que lo usa. state: 0 = nada (cancelado o terminado), 1 = canalizando.
// channel_ms = duración total del canal y remaining_ms lo que falta; cooldown_ms = cuánto falta para poder usarlo de nuevo.
// reason: por qué se cortó o se rechazó ('' si no hay nada que avisar).
message RecallState {
  int32 state = 1;
  int32 channel_ms = 2;
  int32 remaining_ms = 3;
  int32 cooldown_ms = 4;
  string reason = 5;
}

// ---------- Motor de jefes (docs/JEFES.md) ----------
/** Un jefe (o un add lanzador) empieza a castear: barra con nombre. Se corta con un corte duro en cualquier momento, o con uno blando desde `window_from_ms`. */
message BossCast {
  int32 mob_id = 1;
  string name = 2;
  /** Escuela (fis, fuego, acido, sombra): ícono y color de la barra. */
  string school = 3;
  int32 duration_ms = 4;
  /** Desde cuándo (ms desde el inicio) entra un corte blando: el tramo dorado de la barra. */
  int32 window_from_ms = 5;
  /** false = candado: no se corta, hay que defenderse o moverse. */
  bool interruptible = 6;
}
/** Terminó un casteo. result: 0 = salió, 1 = lo cortaron ("¡Interrumpido!"), 2 = se canceló (el jefe volvió a su lugar). */
message BossCastEnd {
  int32 mob_id = 1;
  int32 result = 2;
  /** Nombre de quien lo cortó (vacío si no lo cortaron). */
  string by = 3;
}
/** Aviso en el piso: un círculo de radio `r` en (x, y) que pega a los `warn_ms`. */
message BossTelegraph {
  int32 mob_id = 1;
  string name = 2;
  float x = 3;
  float y = 4;
  float r = 5;
  int32 warn_ms = 6;
}
/** Charco que dura: daña cada segundo a quien esté adentro durante `duration_ms`. */
message BossZone {
  int32 id = 1;
  int32 mob_id = 2;
  string name = 3;
  float x = 4;
  float y = 5;
  float r = 6;
  int32 duration_ms = 7;
}
/** Cambio de fase del jefe: adds, furia (borde rojo) o furia final por tiempo. */
message BossPhase {
  int32 mob_id = 1;
  /** Qué pasó: "adds", "furia", "furia_final", "reinicio". */
  string event = 2;
  string text = 3;
  bool enraged = 4;
}

/** Lanzar un hechizo con proyectil (Saeta ígnea, Bola de fuego) a un jugador: se apunta a una posición y vuela; pega solo si el blanco sigue ahí al llegar. */
message ProjectileLaunchRequest {
  string spell = 1;
  int64 target_id = 2;
  float aim_x = 3;
  float aim_y = 4;
}
/** Visual del proyectil de un jugador: sale de (from_x, from_y) y llega a (to_x, to_y) en travel_ms. */
message PlayerProjectile {
  int64 player_id = 1;
  string spell = 2;
  float from_x = 3;
  float from_y = 4;
  float to_x = 5;
  float to_y = 6;
  int32 travel_ms = 7;
}
